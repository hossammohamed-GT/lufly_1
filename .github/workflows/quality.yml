name: Quality and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, curl, fileinfo, gd
          coverage: none
      - name: Syntax check
        run: find app config core database modules resources routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Repository contract tests
        run: php tests/run.php
      - name: Database migration status
        env:
          APP_ENV: local
          APP_KEY: base64:CI-only-not-a-production-key-000000000000
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: database/lufly.sqlite
        run: php cli migrate:status

  security:
    name: Secret and sensitive-file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Production safety contracts
        run: |
          test ! -f .env
          ! grep -Eq '^APP_KEY=base64:.+' .env.example
          ! grep -RIn --exclude='*.md' --exclude='*.example' -E 'APP_DEBUG=true' config public bootstrap.php
