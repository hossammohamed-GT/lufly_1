name: Quality and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, curl, fileinfo, gd
          coverage: none
      - name: Syntax check
        run: find app config core database modules public resources routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: HTTP smoke check (SQLite)
        env:
          APP_ENV: local
          APP_KEY: base64:CI-only-not-a-production-key-000000000000
          DB_CONNECTION: sqlite
        run: |
          php -S 127.0.0.1:8089 server.php >/tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 2
          for path in /en /en/products /en/products/1653-8033c /tr/urunler/1653-8033c /cs/produkty/1653-8033c; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8089${path}")
            test "$code" = "200" || { echo "Failed $path with HTTP $code"; cat /tmp/php-server.log; exit 1; }
          done
      - name: Database migration status
        env:
          APP_ENV: local
          APP_KEY: base64:CI-only-not-a-production-key-000000000000
          DB_CONNECTION: sqlite
          DB_SQLITE_PATH: /tmp/lufly-quality.sqlite
        run: php cli migrate

  mysql_smoke:
    name: MySQL 8.0 dump & HTTP smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lufly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, curl, fileinfo, gd
          coverage: none
      - name: Import lufly-database.sql into MySQL 8.0
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot lufly_test < lufly-database.sql
          TABLES=$(mysql -N -s -h 127.0.0.1 -P 3306 -uroot -proot -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'lufly_test';")
          test "$TABLES" = "50" || { echo "Expected 50 tables, got $TABLES"; exit 1; }
      - name: HTTP smoke check on MySQL 8.0
        env:
          APP_ENV: local
          APP_KEY: base64:CI-only-not-a-production-key-000000000000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: lufly_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php -S 127.0.0.1:8089 server.php >/tmp/php-mysql-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 2
          for path in /en /en/products /en/products/1653-8033c /tr/urunler/1653-8033c /cs/produkty/1653-8033c; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8089${path}")
            test "$code" = "200" || { echo "Failed $path with HTTP $code"; cat /tmp/php-mysql-server.log; exit 1; }
          done

  security:
    name: Secret and sensitive-file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Production safety contracts
        run: |
          test ! -f .env
          ! grep -Eq '^APP_KEY=base64:.+' .env.example
          ! grep -RIn --exclude='*.md' --exclude='*.example' -E 'APP_DEBUG=true' config public bootstrap.php
